# Duas redes, de propósito.
#
# `internal` — o barramento comum: app, jobs, discord-bot, python-scraper, searxng.
# `browser`  — SÓ o chrome e quem precisa dirigi-lo (app, jobs, discord-bot, test).
#
# A separação existe porque o CDP na 9222 não tem autenticação e o Chromium marcou
# isso como WontFix: quem alcança a porta dirige o navegador e lê todos os cookies
# da sessão (o ataque tem nome, "Cookie Crimes"). O `python-scraper` é o container
# de maior exposição do stack — roda engines de evasão contra sites hostis, com
# entrada vinda dos alvos — e não tem motivo nenhum para alcançar o chrome. Com o
# perfil do Chrome persistente e logado, essa vizinhança passaria a valer uma conta.
networks:
  internal:
    driver: bridge
  browser:
    driver: bridge

services:
  # ── Serviço principal: API Puma ────────────────────────────────────────────
  app:
    image: cleitin-bot:${IMAGE_TAG:-latest}
    build:
      context: ..                    # raiz do projeto
      dockerfile: docker/Dockerfile  # relativo ao context
    env_file:
      - ../.env                      # variáveis de ambiente (não commitar)
    environment:
      RAILS_ENV: production
      CHROME_HOST: chrome
      CHROME_PORT: "9222"
      RAILS_LOG_TO_STDOUT: "true"
      XDG_CONFIG_HOME: /tmp/.chromium
      XDG_CACHE_HOME: /tmp/.chromium
      PYTHON_SCRAPER_URL: "http://python-scraper:8080"
    volumes:
      # Bind mount relativo ao docker-compose.yml → ../storage = raiz do projeto
      # NUNCA volume nomeado: o banco de producao vive em storage/ no host
      # (CLAUDE.md: SQLite bind mount obrigatorio).
      - ../storage:/rails/storage
    # Loopback apenas: /internal/extract é consumido pelo Hermes na mesma VM.
    # O firewall do host é uma camada só — não publicar em 0.0.0.0.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      chrome:
        condition: service_healthy
    networks:
      - internal
      - browser
    entrypoint: bin/entrypoint
    command: bin/rails server -b 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Serviço de Jobs: Solid Queue ──────────────────────────────────────────
  jobs:
    image: cleitin-bot:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env                      # variáveis de ambiente (não commitar)
    environment:
      RAILS_ENV: production
      CHROME_HOST: chrome
      CHROME_PORT: "9222"
      RAILS_LOG_TO_STDOUT: "true"
      XDG_CONFIG_HOME: /tmp/.chromium
      XDG_CACHE_HOME: /tmp/.chromium
      PYTHON_SCRAPER_URL: "http://python-scraper:8080"
    volumes:
      - ../storage:/rails/storage
    # O `bin/jobs start` (Solid Queue supervisor) NÃO roda `db:prepare`. No
    # primeiro deploy ele abriria o `production_queue.sqlite3` vazio e reiniciaria
    # com erro de tabela inexistente. O `app` já executa `db:prepare` no seu
    # entrypoint (incluindo as migrations do `queue_migrate`) e expõe
    # healthcheck de `/up`; fazer `jobs` depender da saúde do `app` garante que
    # o banco de fila foi criado/migrado antes do worker subir.
    depends_on:
      chrome:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - internal
      - browser
    entrypoint: bin/entrypoint-jobs
    command: bin/jobs start
    restart: unless-stopped

  # ── Discord Bot: Chatbot Tool Caller ─────────────────────────────────────
  discord-bot:
    image: cleitin-bot:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      PYTHON_SCRAPER_URL: "http://python-scraper:8080"
      DISCORD_OPEN_CHANNEL_IDS: ${DISCORD_OPEN_CHANNEL_IDS:-}
      # Donos das ferramentas de gestao (add/remove/promote profile). Sem isso
      # o owner? do ManagementToolBase retorna false para TODO mundo.
      DISCORD_OWNER_IDS: ${DISCORD_OWNER_IDS:-}
      DISCORD_MUTE_PREFIX: ${DISCORD_MUTE_PREFIX:-//}
      DISCORD_COMPACTION_THRESHOLD: ${DISCORD_COMPACTION_THRESHOLD:-0.75}
      DISCORD_REHYDRATE_MESSAGES: ${DISCORD_REHYDRATE_MESSAGES:-30}
      DISCORD_PROTECTED_TAIL: ${DISCORD_PROTECTED_TAIL:-8}
      # Quantas conversas o /sessions mostra por pagina.
      DISCORD_SESSIONS_PAGE_SIZE: ${DISCORD_SESSIONS_PAGE_SIZE:-20}
      # Teto de conversas que os comandos alcancam. Guarda de memoria da consulta,
      # nao limite de uso.
      DISCORD_SESSIONS_MAX: ${DISCORD_SESSIONS_MAX:-500}
      DISCORD_COMMAND_GUILD_ID: ${DISCORD_COMMAND_GUILD_ID:-}
      DISCORD_ATTACHMENT_MAX_BYTES: ${DISCORD_ATTACHMENT_MAX_BYTES:-10485760}
      DISCORD_ATTACHMENT_MAX_CHARS: ${DISCORD_ATTACHMENT_MAX_CHARS:-30000}
      DISCORD_OUTPUT_CODE_LINES: ${DISCORD_OUTPUT_CODE_LINES:-25}
      DISCORD_OUTPUT_PROSE_CHARS: ${DISCORD_OUTPUT_PROSE_CHARS:-4000}
      # Esforco de raciocinio do elo Nous. Aceitos: none, low, medium, high.
      # Valor fora dessa lista da HTTP 400 em TODA chamada do elo, entao a
      # ModelChain recusa o invalido e cai em `none`, com aviso no log.
      DISCORD_EFFORT_NOUS: ${DISCORD_EFFORT_NOUS:-none}
      # Vazio = raciocinio DESLIGADO na rota direta da Poolside (o padrao).
      # `true` devolve o comportamento padrao da API. Medido em 07/08/2026:
      # desligado, mediana de 254 ms e zero tokens de raciocinio; ligado, 9,7s e
      # ~1.100 tokens. A rota nao aceita reasoning_effort, so
      # chat_template_kwargs.enable_thinking. Religue se as respostas ficarem
      # curtas demais em pergunta dificil.
      DISCORD_POOLSIDE_THINKING: ${DISCORD_POOLSIDE_THINKING:-}
    volumes:
      - ../storage:/rails/storage
    networks:
      - internal
      - browser
    entrypoint: bin/discord-bot
    restart: unless-stopped

  # ── Chrome Headless Shell ─────────────────────────────────────────────────
  chrome:
    image: chromedp/headless-shell:stable
    # Limites explícitos de recursos: o navegador processa páginas externas e
    # roda na mesma VM que app e workers (24 GB / 4 OCPUs). Consumo descontrolado
    # pode causar OOM global. Valores compatíveis com a VM documentada:
    #   - mem_limit 4g < 24 GB do host; shm_size 2gb continua dentro do teto.
    #   - pids_limit conservador: o chrome-fleet abre dezenas de processos por aba.
    shm_size: '2gb'
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - seccomp:unconfined
    # SEM `ports:` de propósito. A 9222 é o CDP — controle remoto total do navegador,
    # sem autenticação, WontFix no Chromium. O Rails nunca usou a porta do host: fala
    # com `chrome:9222` pela rede. Publicá-la em 127.0.0.1 dava a qualquer processo
    # local da VM o poder de dirigir o navegador e roubar os cookies da sessão.
    # Para depurar com `chrome://inspect`, republique temporariamente e remova depois.
    #
    # `--user-data-dir` + volume dá perfil estável (Local Storage, cache, origin
    # trials). ATENÇÃO — MEDIDO EM 04/08, COM CONTROLE: esta imagem NÃO persiste
    # COOKIE em disco. Nem com navegação real nem com parada graciosa aparece um
    # arquivo `Cookies` no perfil; o `Default/` fica só com Cache, Local Storage e
    # companhia. O armazém durável de sessão continua sendo o jar no banco
    # (`Fetcher::CookieJar`); o Chrome guarda a sessão apenas enquanto o processo
    # vive. Trocar para um Chromium completo é o que mudaria isso.
    command: ["--user-data-dir=/data"]
    volumes:
      - chrome-profile:/data
    networks:
      - browser
    healthcheck:
      # printf é portátil (POSIX) — `echo -e` não é suportado pelo dash usado
      # pelo /bin/sh do CMD-SHELL em imagens Debian (chromedp/headless-shell).
      # Usa formato longo para evitar escaping de aspas dentro do flow seq.
      test:
        - "CMD-SHELL"
        - "printf 'GET /json/version HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' | socat -T3 - TCP:localhost:9222 | grep -q webSocketDebuggerUrl"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Test Runner (on-demand) ─────────────────────────────────────────────
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: rails
    environment:
      RAILS_ENV: test
      CHROME_HOST: chrome
      CHROME_PORT: "9222"
      # Banco de teste apontado para um SQLite em /tmp — ambiente inline, não
      # secreto, e não depende do .env compartilhado da produção.
      DATABASE_URL: "sqlite3:/tmp/clayton_test.sqlite3"
      # Chaves de criptografia de TESTE (geradas via `rails db:encryption:init`
      # em 13/08, campanha laguna-fix): o modelo BrowserSessionCookie usa
      # `encrypts :payload` (migration 20260812000001) e sem elas toda a suíte
      # do CookieJar morre com Missing encryption credential. São chaves de
      # teste, nunca usadas em produção.
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "QHPi2qXwoQDy93VkdLVD1PGvJm38wy0X"
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "zA88ZTnHms1QvOVPygCY4z1tdwc6lOtt"
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "Af7tSdX0dqlrQVKRvZFHatqFwoO9NUuv"
    volumes:
      # Checkout read-only: o container de teste nunca deve escrever no source.
      - ../:/rails:ro
      # Apenas diretórios temporários explicitamente graváveis. Bind (não
      # tmpfs): o daemon root do CI não monta tmpfs aninhado dentro do bind
      # :ro de /rails (mountpoint não é criado — read-only file system, 13/08).
      # O workflow cria tmp/ log/ com chmod 777 antes do run.
      - ../tmp:/rails/tmp
      - ../log:/rails/log
      # tmpfs gravável sobre /tmp — SQLite de teste vive só na memória do
      # container. O bind-mount /tmp/clayton_test.sqlite3:/tmp/... cria um
      # arquivo vazio (0 bytes) no host antes do Rails subir, e um SQLite
      # vazio pode ser aberto como "banco corrompido" em vez de "banco novo",
      # disparando SQLite3::CorruptException. O tmpfs evita o arquivo no host
      # e descarta o estado a cada container restart (correto para testes).
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 134217728  # 128MB — mais que suficiente para testes.
    networks:
      - internal
      - browser
    profiles:
      - test
    entrypoint: bin/rails
    command: test

  # ── Python Scraper Sidecar ──────────────────────────────────────────────
  python-scraper:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    # env_file DEDICADO — nunca ../.env. Este é o container de maior exposição do
    # stack: roda nodriver/camoufox/curl-impersonate CONTRA sites hostis, com
    # entrada vinda dos próprios alvos de scraping. Dar a ele SECRET_KEY_BASE,
    # DISCORD_BOT_TOKEN e as chaves de LLM é o pior lugar possível para guardá-las.
    # `.env.sidecar` casa com o padrão `.env.*` do .gitignore; `sidecar.env` não
    # casaria e seria commitado com o token dentro.
    # `required: false`: sem o arquivo (CI, dev), o serviço sobe com env vazio —
    # sem isso o `docker compose` inteiro falha no load quando o arquivo falta.
    env_file:
      - path: ./.env.sidecar
        required: false
    volumes:
      - ../scripts/python:/app/scripts
      - scraping-data:/data
    environment:
      - PYTHONUNBUFFERED=1
    # Sem `ports:` de propósito — só alcançável pela rede interna (app/jobs).
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── SearXNG Web Search ───────────────────────────────────────────────────
  searxng:
    # PINADA POR DIGEST, de propósito. `:latest` é tag mutável e
    # `docker compose up` NÃO a repuxa: esta VM ficou 3 meses na 2026.4.22, com o
    # duckduckgo quebrado, achando que estava atualizada — metade do incidente de
    # 05/08/2026 foi só isso. Com o digest, atualizar volta a ser decisão
    # explícita, como o IMAGE_TAG já faz nas imagens próprias.
    #
    # Este digest é a 2026.8.4, a versão medida em 05/08/2026 (é ela que traz o
    # duckduckgo reescrito e o `duckduckgo web`). Para atualizar de propósito:
    #   docker pull searxng/searxng:latest
    #   docker image inspect searxng/searxng:latest --format '{{index .RepoDigests 0}}'
    # cole o digest aqui, suba e rode `scripts/proofs/web_search_proof.sh` —
    # upgrade de SearXNG mexe no catálogo de engines, e o `keep_only` do
    # settings.yml descarta nome inválido em SILÊNCIO.
    image: searxng/searxng@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
    # env_file DEDICADO — nunca ../.env. O searxng busca e parseia HTML de sites
    # arbitrários da internet: mesma categoria de exposição do python-scraper.
    # Precisa de UMA variável (SEARXNG_SECRET_KEY, lida por `!env` no
    # settings.yml); `../.env` entregava 26, incluindo SECRET_KEY_BASE,
    # DISCORD_BOT_TOKEN, as chaves de LLM e o INTERNAL_EXTRACT_TOKEN.
    # `.env.searxng` casa com o padrão `.env.*` do .gitignore; `searxng.env` não
    # casaria e seria commitado com o segredo dentro.
    # `required: false`: sem o arquivo (CI, dev), o serviço sobe sem a secret —
    # o settings.yml do CI usa valor padrão. Sem isto o compose inteiro falha no
    # load quando o arquivo falta.
    env_file:
      - path: ./.env.searxng
        required: false
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
    volumes:
      - ./searxng:/etc/searxng:ro
    # Publicada só no loopback: o Hermes (perfil reader) usa esta instância como
    # backend de web_search via SEARXNG_URL. Não é acessível de fora da VM.
    ports:
      - "127.0.0.1:8888:8080"
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  scraping-data:
  chrome-profile:
